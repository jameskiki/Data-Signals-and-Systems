name: Tests

on:
  push:
  pull_request:

jobs:
  unit_tests:
    name: Unit and app-layer tests (3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run core test suite
        run: |
          python -m pytest Tests -q -k "not workflows_integration"

  integration_tests:
    name: Integration workflow tests (3.12)
    runs-on: ubuntu-latest
    needs: unit_tests
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run integration workflow tests
        run: |
          python -m pytest Tests/test_workflows_integration.py -q
